<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sockstack</title>
<style>
  /* Dark only, deliberately: this is a console that sits open next to a
     terminal, and the palette matches the CLI's own output. Fonts are the
     system stack — a forensic tool should not call out to a font CDN when a
     page opens, and on an isolated analysis host it would simply not render. */
  :root {
    --bg: #0d0e11; --panel: #141519; --raised: #1a1c21; --sunken: #0f1013;
    --line: #2b2e34; --hair: #23262b;
    --ink: #e6e6e3; --mid: #d5d6d2; --dim: #8b8f96; --faint: #6f747c;
    --accent: #7fc4a0; --warn: #e0975f; --bad: #e08a7a;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: var(--ink); }
  .mono { font-family: var(--mono); }
  .cap { font: 600 11px/1 var(--mono); letter-spacing: .14em;
         text-transform: uppercase; color: var(--dim); }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  @keyframes blink { 0%,55% { opacity: 1 } 56%,100% { opacity: 0 } }

  /* ---- chrome ---- */
  .bar { display: flex; align-items: center; gap: 12px; padding: 13px 22px;
         border-bottom: 1px solid var(--hair); background: #111216; flex-wrap: wrap; }
  .logo { width: 20px; height: 20px; border-radius: 5px; background: var(--accent);
          display: flex; align-items: center; justify-content: center; flex: none; }
  .logo i { width: 7px; height: 7px; background: var(--bg); display: block; }
  .brand { font: 600 14px/1 var(--mono); }
  .sep { width: 1px; height: 20px; background: var(--line); }
  .grow { flex: 1; }
  .chip { display: flex; align-items: center; gap: 8px; background: var(--raised);
          border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px;
          font: 500 12px/1 var(--mono); color: var(--mid); }
  select.chip { padding-right: 26px; appearance: none; cursor: pointer; max-width: 260px; }
  input.chip { width: 110px; }
  .pill { display: flex; align-items: center; gap: 8px; font: 600 12px/1 var(--mono);
          padding: 8px 13px; border-radius: 20px; border: 1px solid var(--line);
          color: var(--dim); background: var(--raised); }
  .pill.live { color: var(--accent); border-color: var(--accent);
               background: rgba(127,196,160,.08); }
  .pill.live .dot { animation: pulse 1.4s ease-in-out infinite; }
  .pill.lang { cursor: pointer; color: var(--faint); letter-spacing: .04em; }
  .pill.lang:hover { color: var(--mid); border-color: var(--accent); }
  .pill.lang b { color: var(--accent); font-weight: 600; }
  .btn { cursor: pointer; background: var(--raised); border: 1px solid var(--line);
         color: var(--mid); font-weight: 500; padding: 11px 18px; border-radius: 9px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--bg); border: none; font-weight: 600; }
  .btn:disabled { opacity: .4; cursor: default; border-color: var(--line); }
  .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer;
            font: 500 12px/1 var(--mono); color: var(--mid); }
  .toggle input { display: none; }
  .toggle i { width: 30px; height: 18px; border-radius: 18px; background: var(--line);
              position: relative; flex: none; transition: background .12s; }
  .toggle i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px;
                     height: 14px; border-radius: 50%; background: var(--faint);
                     transition: all .12s; }
  .toggle input:checked + i { background: var(--accent); }
  .toggle input:checked + i::after { left: 14px; background: var(--bg); }

  /* ---- launch ---- */
  .launch { max-width: 1180px; margin: 0 auto; padding: 34px 40px 60px; }
  .launch h2 { margin: 0 0 8px; font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
  .launch p.sub { margin: 0 0 30px; font-size: 14px; color: var(--dim); }
  .cols { display: grid; grid-template-columns: 1.35fr 1fr; gap: 24px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .card { background: var(--raised); border: 1px solid var(--line);
          border-radius: 12px; padding: 20px; }
  .device { display: flex; align-items: center; gap: 14px; padding: 15px 16px;
            border: 1px solid var(--line); border-radius: 10px; background: #15171b;
            margin-bottom: 10px; cursor: pointer; }
  .device.on { border-color: var(--accent); background: rgba(127,196,160,.07); }
  .device.off { cursor: not-allowed; opacity: .9; }
  .device .icon { width: 38px; height: 38px; border-radius: 9px; background: var(--sunken);
                  border: 1px solid var(--line); display: flex; align-items: center;
                  justify-content: center; font-size: 18px; flex: none; }
  .device .name { font: 600 14px/1.2 var(--mono); }
  .device .meta { font-size: 12px; color: var(--dim); margin-top: 4px; }
  .state { font: 600 11px/1 var(--mono); letter-spacing: .04em; display: flex;
           align-items: center; gap: 6px; }
  .unplug { font: 600 13px/1 var(--mono); color: var(--faint); cursor: pointer;
            padding: 4px 6px; border-radius: 6px; flex: none; }
  .unplug:hover { color: var(--bad); background: rgba(224,138,122,.1); }
  .drop { border: 1px dashed var(--line); border-radius: 10px; padding: 22px 16px;
          text-align: center; cursor: pointer; background: var(--sunken);
          transition: border-color .12s, background .12s; }
  .drop:hover, .drop.over { border-color: var(--accent);
                            background: rgba(127,196,160,.06); }
  .cmd { font: 500 11px/1.7 var(--mono); color: var(--mid); background: var(--sunken);
         border: 1px solid var(--hair); border-radius: 8px; padding: 10px 12px;
         white-space: pre-wrap; word-break: break-all; user-select: all; }
  .drop-main { font-size: 13px; color: var(--mid); line-height: 1.5; }
  .drop-sub { font: 500 11px/1 var(--mono); color: var(--faint); margin-top: 7px; }
  .run-item { padding: 12px 13px; border: 1px solid var(--line); border-radius: 9px;
              background: #15171b; cursor: pointer; margin-bottom: 10px; }
  .run-item:hover { border-color: var(--accent); }
  .run-item .t { font: 600 12px/1.3 var(--mono); color: var(--mid);
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run-item .b { display: flex; justify-content: space-between; margin-top: 6px;
                 font: 500 11px/1 var(--mono); color: var(--faint); }

  /* ---- workspace ---- */
  .work { display: grid; grid-template-columns: 340px 1fr; }
  @media (max-width: 1000px) { .work { grid-template-columns: 1fr; } }
  .mirror { padding: 24px; border-right: 1px solid var(--hair); }
  .phone { position: relative; width: 292px; margin: 0 auto; border: 8px solid var(--line);
           border-radius: 26px; overflow: hidden; background: #000; line-height: 0; }
  .phone img { display: block; width: 100%; height: auto; }
  .phone .blank { aspect-ratio: 9/19; display: flex; align-items: center;
                  justify-content: center; font: 500 11px/1.6 var(--mono);
                  color: var(--faint); text-align: center; padding: 0 20px;
                  background: repeating-linear-gradient(135deg,#16181c 0 11px,#191b20 11px 22px); }
  .hit { position: absolute; border: 1.5px solid var(--accent);
         background: rgba(127,196,160,.12); border-radius: 6px; cursor: pointer; }
  .hit:hover { background: rgba(127,196,160,.3); }
  .hit span { position: absolute; left: 0; top: -16px; font: 600 9px/1.3 var(--mono);
              background: var(--accent); color: var(--bg); padding: 2px 5px;
              border-radius: 3px; white-space: nowrap; }
  .keys { display: flex; gap: 8px; margin-top: 16px; }
  .keys button { flex: 1; font: 500 12px/1 var(--mono); padding: 10px; }
  .hint { margin: 12px 0 0; font-size: 11px; line-height: 1.5; color: var(--faint); }

  .findings { padding: 24px; min-width: 0; }
  .peer { border: 1px solid var(--line); border-radius: 11px; overflow: hidden;
          background: var(--sunken); margin-bottom: 12px; }
  .peer.good { border-color: rgba(127,196,160,.4); background: rgba(127,196,160,.04); }
  .peer.unknown { border-color: rgba(224,151,95,.4); }
  .peer .head { display: flex; align-items: center; justify-content: space-between;
                gap: 12px; padding: 13px 16px; flex-wrap: wrap; }
  .peer.good .head { background: rgba(127,196,160,.06); }
  .peer .addr { font: 600 14px/1 var(--mono); color: var(--mid); }
  .peer.good .addr { color: var(--accent); }
  .badge { font: 600 10px/1 var(--mono); padding: 4px 7px; border-radius: 5px;
           border: 1px solid var(--line); color: var(--dim); background: var(--raised); }
  .badge.good { color: var(--accent); border-color: rgba(127,196,160,.4);
                background: rgba(127,196,160,.1); }
  .badge.unknown { color: var(--warn); border-color: rgba(224,151,95,.4);
                   background: rgba(224,151,95,.1); }
  .frames { padding: 12px 16px; font: 400 11px/1.85 var(--mono); }
  .frames .via { color: var(--faint); padding-left: 14px; }
  .frames .src { color: var(--faint); }
  .note { padding: 0 16px 13px; font: 400 11px/1.6 var(--mono); color: var(--faint); }
  .empty { color: var(--faint); font: 400 12px/1.7 var(--mono); }

  .logstrip { border-top: 1px solid var(--hair); padding: 16px 22px 20px; background: #101116; }
  #log { background: #0b0c0e; border: 1px solid var(--hair); border-radius: 10px;
         padding: 14px 16px; font: 400 12px/1.75 var(--mono); color: #a4a8af;
         height: 190px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  #log.tall { height: 46vh; }
  .ok { color: var(--accent); } .warnc { color: var(--warn); } .badc { color: var(--bad); }
  .cursor { display: inline-block; width: 8px; height: 14px; background: var(--accent);
            vertical-align: -2px; margin-left: 4px; animation: blink 1.1s step-end infinite; }
  .status { font-size: 12px; color: var(--dim); margin-top: 10px; min-height: 17px; }
  .status.bad { color: var(--warn); }
  label.field { display: block; font-size: 11px; color: var(--dim); margin-bottom: 5px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- ============================ launch ============================ -->
<div id="launchView">
  <div class="bar">
    <div class="logo"><i></i></div>
    <span class="brand">sockstack</span>
    <span style="font-size:13px;color:var(--faint)" data-i18n="tagline"></span>
    <div class="grow"></div>
    <span class="pill lang" data-lang-switch>EN · RU</span>
    <span class="pill" id="bindPill">🔒 loopback</span>
  </div>

  <div class="launch">
    <h2 data-i18n="launch.h2"></h2>
    <p class="sub" data-i18n="launch.sub"></p>

    <div class="cols">
     <div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;margin-bottom:14px">
          <span class="cap" data-i18n="card.devices"></span>
          <span class="mono" style="font-size:12px;color:var(--faint);cursor:pointer"
                id="rescan" data-i18n="act.rescan"></span>
        </div>
        <div id="deviceList"></div>

        <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--hair)">
          <label class="field" for="address" data-i18n="connect.label"></label>
          <div style="display:flex;gap:8px">
            <input class="chip" id="address" style="flex:1"
                   placeholder="192.168.100.88:5555">
            <button class="btn" id="connect" data-i18n="act.connect"></button>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:8px;
                      gap:10px;flex-wrap:wrap">
            <span class="mono" style="font-size:11px;color:var(--faint)"
                  data-i18n="connect.hint"></span>
            <div style="display:flex;gap:12px">
              <span class="mono" id="toggleRemote" data-i18n="act.remoteShow"
                    style="font-size:11px;color:var(--accent);cursor:pointer"></span>
              <span class="mono" id="togglePair" data-i18n="act.pairShow"
                    style="font-size:11px;color:var(--accent);cursor:pointer"></span>
            </div>
          </div>

          <div id="remoteBox" class="hidden" style="margin-top:12px">
            <p style="margin:0 0 10px;font-size:11px;line-height:1.6;color:var(--faint)"
               data-i18n="remote.why"></p>
            <div id="remoteCmds"></div>
          </div>
          <div id="pairBox" class="hidden" style="margin-top:10px">
            <p style="margin:0 0 8px;font-size:11px;line-height:1.6;color:var(--faint)"
               data-i18n="pair.why"></p>
            <div style="display:flex;gap:8px">
              <input class="chip" id="pairAddress" style="flex:1"
                     placeholder="192.168.100.88:37021">
              <input class="chip" id="pairCode" style="width:110px" placeholder="123456">
              <button class="btn" id="pair" data-i18n="act.pair"></button>
            </div>
          </div>
          <div class="status" id="connectStatus"></div>
        </div>

        <div style="display:flex;align-items:center;gap:10px;margin-top:16px;
                    padding-top:16px;border-top:1px solid var(--hair)">
          <span class="mono" id="fridaState" style="font-size:12px;color:var(--dim)"></span>
          <span style="color:#3a3d43">·</span>
          <span class="mono" id="provision" data-i18n="act.provision"
                style="font-size:12px;color:var(--dim);cursor:pointer"></span>
        </div>
      </div>

      <div class="card" style="margin-top:24px">
        <div class="cap" style="margin-bottom:6px" data-i18n="card.install"></div>
        <p style="margin:0 0 14px;font-size:12px;line-height:1.6;color:var(--dim)"
           data-i18n="install.why"></p>
        <div class="drop" id="apkDrop">
          <input type="file" id="apkFile" accept=".apk,.apks,.xapk"
                 style="display:none">
          <div class="drop-main" id="apkDropText" data-i18n="install.drop"></div>
          <div class="drop-sub" data-i18n="install.dropSub"></div>
        </div>
        <label class="field" for="apk" style="margin-top:14px"
               data-i18n="install.orPath"></label>
        <div style="display:flex;gap:8px">
          <input class="chip" id="apk" style="flex:1" placeholder="/path/to/target.apk">
          <button class="btn" id="install" data-i18n="act.install"></button>
        </div>
        <div class="status" id="installStatus"></div>
      </div>
     </div>

      <div class="card">
        <div class="cap" style="margin-bottom:14px" data-i18n="card.recent"></div>
        <div style="margin-bottom:10px">
          <label class="field" for="runsRoot" data-i18n="field.runsRoot"></label>
          <input class="chip" id="runsRoot" style="width:100%" placeholder=".">
        </div>
        <div id="runList"></div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:14px;margin-top:26px;flex-wrap:wrap">
      <button class="btn primary" id="openWorkspace" data-i18n="act.openWorkspace"></button>
      <div class="grow"></div>
      <span style="font-size:12px;color:var(--faint);max-width:300px;text-align:right;
                   line-height:1.5" data-i18n="launch.security"></span>
    </div>
    <div class="status" id="launchStatus"></div>
  </div>
</div>

<!-- ============================ workspace ============================ -->
<div id="workView" class="hidden">
  <div class="bar">
    <div class="logo"><i></i></div>
    <span class="brand" id="backToLaunch" style="cursor:pointer">sockstack</span>
    <select class="chip" id="device"></select>
    <select class="chip" id="package"></select>
    <input class="chip" id="output" placeholder="./run" data-i18n-title="title.output">
    <input class="chip" id="duration" type="number" value="200" style="width:88px"
           data-i18n-title="title.duration">
    <label class="toggle"><input type="checkbox" id="attach"><i></i>attach</label>
    <label class="toggle"><input type="checkbox" id="antiRoot"><i></i>anti-root</label>
    <div class="grow"></div>
    <span class="pill lang" data-lang-switch>EN · RU</span>
    <span class="pill" id="statusPill"><span class="dot"
          style="background:var(--dim)"></span><span id="statusText"></span></span>
    <span class="status" id="runStatus" style="margin:0"></span>
    <button class="btn primary" id="start" data-i18n="act.start"></button>
    <button class="btn" id="stop" disabled data-i18n="act.stop"></button>
  </div>

  <div class="work">
    <div class="mirror">
      <div style="display:flex;justify-content:space-between;margin-bottom:14px">
        <span class="cap" data-i18n="card.screen"></span>
        <span class="mono" id="toggleTargets"
              style="font-size:11px;color:var(--accent);cursor:pointer"></span>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <input class="chip" id="apk2" style="flex:1" data-i18n-ph="ph.apk2">
        <button class="btn" id="pickApk2" data-i18n-title="title.pickFile">📂</button>
        <button class="btn" id="install2" data-i18n="act.install"></button>
      </div>
      <div class="phone" id="stage">
        <img id="screen" alt="" hidden>
        <div class="blank" id="noScreen" data-i18n="screen.none"></div>
        <div id="overlay"></div>
      </div>
      <div class="keys">
        <button class="btn" id="back" data-i18n="act.back"></button>
        <button class="btn" id="home" data-i18n="act.home"></button>
        <button class="btn" id="refreshScreen">↻</button>
      </div>
      <p class="hint" data-i18n="screen.hint"></p>
      <div style="display:flex;gap:8px;margin-top:18px">
        <button class="btn" id="launchApp" style="flex:1" data-i18n="act.launchApp"></button>
        <button class="btn" id="reloadPkgs" data-i18n="act.reloadPkgs"></button>
      </div>
      <div class="status" id="deviceStatus"></div>
    </div>

    <div class="findings">
      <div style="display:flex;justify-content:space-between;margin-bottom:14px;
                  gap:10px;flex-wrap:wrap">
        <span class="cap" data-i18n="card.attribution"></span>
        <div style="display:flex;gap:6px" id="findingCounts"></div>
      </div>
      <div id="peers"><div class="empty" data-i18n="findings.none"></div></div>
    </div>
  </div>

  <div class="logstrip">
    <div style="display:flex;justify-content:space-between;margin-bottom:10px">
      <span class="cap" data-i18n="card.log"></span>
      <span class="mono" style="font-size:11px;color:var(--faint);cursor:pointer"
            id="expandLog"></span>
    </div>
    <div id="log"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// ---- language -------------------------------------------------------------
// Two languages, one table. Anything the page says lives here; anything the
// device, adb or sockstack says is passed through untranslated, because a
// translated tool output is no longer the tool's output.
const STRINGS = {
  en: {
    'tagline': 'which code path sent this?',
    'launch.h2': 'Pick a device to start',
    'launch.sub': 'sockstack brings up frida-server and starts the capture itself. ' +
                  'The target is driven through the screen mirror.',
    'launch.security': 'No authentication · drives the device. Reach it from ' +
                       'elsewhere over an SSH tunnel only.',
    'card.devices': '1 · Devices · attached',
    'connect.label': 'a device over the network (emulator, stand, wireless debugging)',
    'connect.hint': 'host, or host:port — 5555 assumed',
    'remote.why': 'The device is on a machine you reach with an SSH key? Do not ' +
                  'point this field at it across the network: adb has no ' +
                  'authentication and neither does this page. Forward a port over ' +
                  'SSH instead and connect to the near end. This panel will not ' +
                  'run ssh for you — it has no login of its own, so it would be ' +
                  'lending your key to whoever opened the page.',
    'remote.a': 'Best — run the panel where the device is, and forward the panel:',
    'remote.aNote': 'then open the same address here, on your own machine.',
    'remote.b': 'Or keep the panel here and forward the device\'s adb port:',
    'remote.bNote': 'then connect to 127.0.0.1:5555 in the field above.',
    'remote.c': 'Or forward the whole adb server and start the panel pointed at it:',
    'remote.cNote': 'every device on that host then appears in the list above.',
    'remote.server': 'talking to adb server',
    'act.remoteShow': 'the device is on a remote host…',
    'act.remoteHide': 'hide the remote recipe',
    'pair.why': 'Android 11+ wireless debugging pairs first, on a different port. ' +
                'Both the port and the six-digit code are shown by the pairing ' +
                'dialog on the device, and both change every time.',
    'act.connect': 'connect',
    'act.disconnect': 'disconnect',
    'act.pair': 'pair',
    'act.pairShow': 'pair a wireless device…',
    'act.pairHide': 'hide pairing',
    'st.paired': 'paired — now connect on the debugging port',
    'card.install': '2 · Install an APK',
    'card.recent': 'Recent runs',
    'card.screen': 'Screen',
    'card.attribution': 'Call-stack attribution',
    'card.log': 'Log',
    'install.why': 'Optional: if the app is already on the device, move on. The ' +
                   'reason to install from here is the package name — it is read ' +
                   'from the difference in <span class="mono">pm list packages</span> ' +
                   'before and after, and the filename will not tell you it.',
    'install.drop': 'Drop an APK here, or click to choose a file',
    'install.dropSub': 'the file is sent to the host running adb',
    'install.orPath': '…or a path on that host',
    'field.runsRoot': 'directory to scan',
    'act.rescan': '↻ rescan',
    'act.provision': 'provision device',
    'act.install': 'install',
    'act.openWorkspace': 'Open the workspace →',
    'act.start': '▶ start run',
    'act.stop': '■ finish early',
    'act.back': '◀ back',
    'act.home': '● home',
    'act.launchApp': 'launch target',
    'act.reloadPkgs': '↻ pkgs',
    'act.showTargets': 'show targets',
    'act.hideTargets': 'hide targets',
    'act.expand': 'expand',
    'act.collapse': 'collapse',
    'ph.apk2': 'APK: path, or pick a file →',
    'title.output': 'output directory',
    'title.duration': 'seconds',
    'title.pickFile': 'choose a file',

const browserRussian = (navigator.language || '').toLowerCase().startsWith('ru');
let LANG = localStorage.getItem('sockstack.lang') || (browserRussian ? 'ru' : 'en');
if (!STRINGS[LANG]) LANG = 'en';
const t = (key, ...subs) => subs.reduce(
  (text, value, i) => text.split('$' + (i + 1)).join(value),
  (STRINGS[LANG] || STRINGS.en)[key] || key);

function applyLang() {
  document.documentElement.lang = LANG;
  localStorage.setItem('sockstack.lang', LANG);
  document.querySelectorAll('[data-i18n]').forEach(
    node => node.innerHTML = t(node.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(
    node => node.placeholder = t(node.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-title]').forEach(
    node => node.title = t(node.dataset.i18nTitle));
  document.querySelectorAll('[data-lang-switch]').forEach(node => node.innerHTML =
    LANG === 'en' ? '<b>EN</b> · RU' : 'EN · <b>RU</b>');
  // Anything the page has already drawn from data has to be redrawn, or half
  // the screen would stay in the language you just left.
  $('toggleTargets').textContent = t(targetsOn ? 'act.hideTargets' : 'act.showTargets');
  $('expandLog').textContent = t($('log').classList.contains('tall')
                                 ? 'act.collapse' : 'act.expand');
  $('togglePair').textContent = t($('pairBox').classList.contains('hidden')
                                  ? 'act.pairShow' : 'act.pairHide');
  const remoteShown = !$('remoteBox').classList.contains('hidden');
  $('toggleRemote').textContent = t(remoteShown ? 'act.remoteHide' : 'act.remoteShow');
  if (remoteShown) remoteRecipe();
  if (!RUN_RUNNING) $('statusText').textContent = t('st.idle');
  loadDevices(); loadRuns(); loadFindings();
}

const post = (p, b) => fetch(p, {method: 'POST', headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify(b || {})}).then(r => r.json());
const get = p => fetch(p).then(r => r.json());
const dev = () => $('device').value;
const esc = t => String(t == null ? '' : t).replace(/[&<>]/g,
  c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
function say(id, text, bad) {
  const n = $(id); n.textContent = text || ''; n.className = 'status' + (bad ? ' bad' : '');
}

// ---- devices --------------------------------------------------------------
let devices = [];
let adbServer = 'tcp:127.0.0.1:5037';
async function loadDevices() {
  const data = await get('/api/devices');
  devices = data.devices || [];
  adbServer = data.server || adbServer;
  if (!$('remoteBox').classList.contains('hidden')) remoteRecipe();
  const list = $('deviceList');
  list.innerHTML = '';
  const select = $('device');
  const previous = select.value;
  select.innerHTML = '';
  if (!devices.length) {
    list.innerHTML = `<div class="empty">${t('dev.none')}</div>`;
  }
  devices.forEach(d => {
    const ready = d.state === 'device';
    const row = document.createElement('div');
    row.className = 'device' + (ready ? '' : ' off');
    row.innerHTML =
      `<div class="icon">${ready ? '📱' : '⛔'}</div>
       <div style="flex:1;min-width:0">
         <div class="name">${esc(d.serial)}${d.model ? ' · ' + esc(d.model) : ''}</div>
         <div class="meta" data-meta="${esc(d.serial)}">${ready ? '…' :
           t('dev.unauthorised')}</div>
       </div>
       <span class="state" style="color:${ready ? 'var(--accent)' : 'var(--warn)'}">
         ${ready ? '<span class="dot" style="background:var(--accent)"></span>READY'
                 : d.state.toUpperCase()}</span>
       ${d.network ? `<span class="unplug" title="${t('act.disconnect')}">✕</span>` : ''}`;
    if (ready) {
      row.onclick = () => { select.value = d.serial; markSelected(); onDeviceChange(); };
    }
    const unplug = row.querySelector('.unplug');
    if (unplug) unplug.onclick = async event => {
      event.stopPropagation();                     // not a device pick
      const data = await post('/api/disconnect', {address: d.serial});
      say('connectStatus', data.output, !data.ok);
      loadDevices();
    };
    list.appendChild(row);
    if (ready) {
      const option = document.createElement('option');
      option.value = d.serial;
      option.textContent = d.serial + (d.model ? ' · ' + d.model : '');
      select.appendChild(option);
    }
  });
  if (previous && [...select.options].some(o => o.value === previous)) select.value = previous;
  markSelected();
  if (select.value) { onDeviceChange(); loadDeviceInfo(); }
  say('launchStatus', data.error || '', !!data.error);
}
function markSelected() {
  [...$('deviceList').children].forEach(row => {
    const name = row.querySelector('.name');
    row.classList.toggle('on', !!name && name.textContent.startsWith(dev()));
  });
}
async function loadDeviceInfo() {
  if (!dev()) return;
  const info = await get('/api/deviceinfo?device=' + encodeURIComponent(dev()));
  const meta = document.querySelector(`[data-meta="${CSS.escape(dev())}"]`);
  if (meta && info.ok) {
    meta.textContent = [info.release && 'Android ' + info.release, info.abi, info.build]
      .filter(Boolean).join(' · ');
  }
  $('fridaState').innerHTML = info.frida
    ? `<span class="dot" style="background:var(--accent)"></span> ${t('dev.frida.on')}`
    : `<span class="dot" style="background:var(--warn)"></span> ${t('dev.frida.off')}`;
}

// ---- packages -------------------------------------------------------------
async function loadPackages() {
  if (!dev()) return;
  const data = await get('/api/packages?device=' + encodeURIComponent(dev()));
  const select = $('package');
  select.innerHTML = '';
  (data.packages || []).forEach(p => {
    const option = document.createElement('option');
    option.value = p.package;
    option.textContent = p.package + (p.installed ? '   ' + p.installed : '');
    select.appendChild(option);
  });
  say('deviceStatus', data.ok ? `${(data.packages || []).length} ${t('st.packages')}`
                              : (data.error || ''), !data.ok);
}

// ---- screen ---------------------------------------------------------------
let targetsOn = false;
function refreshScreen() {
  if (!dev()) return;
  const image = $('screen');
  image.onload = () => { image.hidden = false; $('noScreen').classList.add('hidden');
                         if (targetsOn) loadTargets(); };
  image.onerror = () => { image.hidden = true; $('noScreen').classList.remove('hidden');
                          $('noScreen').textContent = t('screen.failed'); };
  image.src = '/api/screen?device=' + encodeURIComponent(dev()) + '&t=' + Date.now();
}
async function loadTargets() {
  const image = $('screen');
  if (!image.naturalWidth) return;
  const data = await get('/api/elements?device=' + encodeURIComponent(dev()));
  const overlay = $('overlay');
  overlay.innerHTML = '';
  if (!data.ok) { say('deviceStatus', data.error, true); return; }
  const scale = image.clientWidth / image.naturalWidth;
  (data.elements || []).forEach(el => {
    const [x1, y1, x2, y2] = el.bounds;
    const box = document.createElement('div');
    box.className = 'hit';
    box.style.cssText = `left:${x1 * scale}px;top:${y1 * scale}px;` +
                        `width:${(x2 - x1) * scale}px;height:${(y2 - y1) * scale}px`;
    const name = el.id || el.text || el.desc || el.cls;
    if (name) box.innerHTML = `<span>${esc(name.slice(0, 30))}</span>`;
    box.title = `${el.cls} ${el.id ? '#' + el.id : ''} ${el.text}`.trim();
    box.onclick = e => { e.stopPropagation(); tap(el.center[0], el.center[1], name); };
    overlay.appendChild(box);
  });
  say('deviceStatus', `${(data.elements || []).length} ${t('st.elements')}`);
}
async function tap(x, y, what) {
  await post('/api/tap', {device: dev(), x, y});
  say('deviceStatus', `${t('st.tapped')} ${what || x + ',' + y}`);
  setTimeout(refreshScreen, 700);
}
$('stage').addEventListener('click', e => {
  const image = $('screen');
  if (!image.naturalWidth || image.hidden) return;
  const rect = image.getBoundingClientRect();
  const scale = image.naturalWidth / rect.width;
  tap(Math.round((e.clientX - rect.left) * scale),
      Math.round((e.clientY - rect.top) * scale));
});

// ---- findings -------------------------------------------------------------
async function loadFindings() {
  const directory = $('output').value;
  if (!directory) return;
  const data = await get('/api/attribution?dir=' + encodeURIComponent(directory));
  const box = $('peers');
  const counts = $('findingCounts');
  if (!data.ok) {
    box.innerHTML = `<div class="empty">${esc(data.error || t('findings.nothing'))}</div>`;
    counts.innerHTML = ''; return;
  }
  const sites = (data.cards || []).reduce((n, c) => n + c.sites.length, 0);
  counts.innerHTML =
    `<span class="badge">${data.cards.length} ${t('b.peers')}</span>` +
    `<span class="badge">${sites} ${t('b.sites')}</span>` +
    `<span class="badge">${data.records} ${t('b.records')}</span>` +
    (data.bridge === false
      ? `<span class="badge unknown">${t('b.noBridge')}</span>` : '');
  const cross = data.cross_check || {};
  const crossLine = cross.status === 'ok'
    ? `<div class="empty" style="margin-bottom:12px">` +
      `${t('cross.ok', cross.uid, cross.polls_succeeded)}</div>`
    : cross.status
      ? `<div class="empty" style="margin-bottom:12px;color:var(--warn)">` +
        `${t('cross.bad', esc(cross.status))}</div>`
      : '';
  box.innerHTML = crossLine + ((data.cards || []).map(card => {
    const frames = card.sites.map(s => {
      const app = (s.app || []).map(f =>
        `<div>${esc(f).replace(/(\(.*\))$/, '<span class="src">$1</span>')}</div>`).join('');
      const via = s.via ? `<div class="via">via ${esc(s.via)}</div>` : '';
      return app + via;
    }).join('<div style="height:6px"></div>');
    return `<div class="peer ${card.tone}">
      <div class="head">
        <span class="addr">${esc(card.peer)}</span>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${card.ops ? `<span class="badge">${card.ops} ${t('b.ops')}</span>` : ''}
          ${card.sites.length ? `<span class="badge good">${card.sites.length} ${t('b.site')}</span>` : ''}
          <span class="badge ${card.tone}">${esc(card.kind)}</span>
        </div>
      </div>
      ${frames ? `<div class="frames">${frames}</div>` : ''}
      <div class="note">${esc(card.note || card.label)}</div>
    </div>`;
  }).join('') || `<div class="empty">${t('findings.noPeers')}</div>`);
}

// ---- recent runs ----------------------------------------------------------
async function loadRuns() {
  const root = $('runsRoot').value || '.';
  const data = await get('/api/runs?root=' + encodeURIComponent(root));
  const list = $('runList');
  if (!(data.runs || []).length) {
    list.innerHTML = `<div class="empty">${t('runs.none')}</div>`; return;
  }
  list.innerHTML = data.runs.map(r => `
    <div class="run-item" data-dir="${esc(r.dir)}">
      <div class="t">${esc(r.target)}</div>
      <div class="b">
        <span>${esc(r.started)} · ${esc(r.mode)}</span>
        <span style="color:${r.bridge === false ? 'var(--warn)' : 'var(--dim)'}">
          ${r.bridge === false ? t('runs.bridgeFailed')
                               : `${r.sites} ${t('b.site')} · ${r.records} ${t('b.records')}`}</span>
      </div>
    </div>`).join('');
  [...list.children].forEach(node => node.onclick = () => {
    $('output').value = node.dataset.dir;
    outputIsAuto = false;                  // this directory was chosen, not guessed
    showWorkspace(); loadFindings();
  });
}

// ---- run control ----------------------------------------------------------
let since = 0;
let RUN_RUNNING = false;
function paint(line) {
  const cls = line.startsWith('[+]') ? 'ok' : line.startsWith('[!]') ? 'badc'
            : line.startsWith('[i]') || line.startsWith('[·]') ? 'warnc' : '';
  return cls ? `<span class="${cls}">${esc(line)}</span>` : esc(line);
}
async function pollLog() {
  const data = await get('/api/log?since=' + since);
  if (data.lines && data.lines.length) {
    const log = $('log');
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    log.innerHTML += data.lines.map(paint).join('\n') + '\n';
    if (atBottom) log.scrollTop = log.scrollHeight;
    since = data.next;
  }
  RUN_RUNNING = !!data.running;
  $('stop').disabled = !data.running;
  $('start').disabled = !!data.running;
  const pill = $('statusPill');
  pill.classList.toggle('live', !!data.running);
  pill.querySelector('.dot').style.background =
    data.running ? 'var(--accent)' : 'var(--dim)';
  $('statusText').textContent = data.running
    ? `${t('st.running')} · ${data.elapsed}s` : t('st.idle');
  if (!data.running && data.output && data.output === $('output').value) loadFindings();
  setTimeout(pollLog, data.running ? 1000 : 3000);
}

$('start').onclick = async () => {
  if (!$('output').value.trim()) { outputIsAuto = true; fillOutputIfUntouched(); }
  $('log').innerHTML = ''; since = 0;
  say('runStatus', '');
  const data = await post('/api/run', {
    device: dev(), package: $('package').value, output: $('output').value,
    duration: $('duration').value, attach: $('attach').checked,
    anti_root: $('antiRoot').checked});
  // Next to the button that was pressed. This message used to go to the status
  // line at the foot of the other column, which made a refusal look like a
  // button that does nothing.
  if (!data.ok) { say('runStatus', data.message, true); $('output').focus(); }
};
$('stop').onclick = () => post('/api/stop');

// ---- install --------------------------------------------------------------
// Two ways in, because the APK is on one of two machines: already on the host
// running adb (a path), or on the machine holding the browser (upload first).
async function upload(file, statusId) {
  say(statusId, `${t('st.uploading')} ${file.name} ` +
                `(${(file.size / 1048576).toFixed(1)} MB)…`);
  const response = await fetch('/api/upload', {
    method: 'POST', headers: {'X-Filename': file.name}, body: file});
  const data = await response.json();
  if (!data.ok) { say(statusId, data.error || t('st.uploadFailed'), true); return ''; }
  return data.path;
}
async function installApk(source, statusId) {
  if (!dev()) { say(statusId, t('st.needDevice'), true); return; }
  const path = typeof source === 'string' ? source.trim()
                                          : await upload(source, statusId);
  if (!path) {
    if (typeof source === 'string') say(statusId, t('st.needApk'), true);
    return;
  }
  say(statusId, t('st.installing'));
  const data = await post('/api/install', {device: dev(), path: path});
  await loadPackages();
  if (data.installed) {
    // The name the tracer needs, which the filename never tells you.
    $('package').value = data.installed;
    say(statusId, `${t('st.installed')} ${data.installed}`);
  } else {
    // adb's own words on failure — a translated install error is a worse error.
    say(statusId, data.output || t('st.installFailed'), !data.ok);
  }
}
$('install').onclick = () => installApk($('apk').value, 'installStatus');
$('install2').onclick = () => installApk($('apk2').value, 'deviceStatus');
$('apkDrop').onclick = () => $('apkFile').click();
$('pickApk2').onclick = () => { pickerStatus = 'deviceStatus'; $('apkFile').click(); };
let pickerStatus = 'installStatus';
$('apkFile').onchange = event => {
  const file = event.target.files[0];
  if (file) {
    $('apkDropText').textContent = file.name;
    installApk(file, pickerStatus);
  }
  pickerStatus = 'installStatus';
  event.target.value = '';                 // so the same file can be picked twice
};
['dragenter', 'dragover'].forEach(name => $('apkDrop').addEventListener(name, event => {
  event.preventDefault(); $('apkDrop').classList.add('over');
}));
['dragleave', 'drop'].forEach(name => $('apkDrop').addEventListener(name, event => {
  event.preventDefault(); $('apkDrop').classList.remove('over');
}));
$('apkDrop').addEventListener('drop', event => {
  const file = event.dataTransfer.files[0];
  if (file) { $('apkDropText').textContent = file.name; installApk(file, 'installStatus'); }
});
$('launchApp').onclick = async () => {
  await post('/api/launch', {device: dev(), package: $('package').value});
  setTimeout(refreshScreen, 1200);
};
// ---- connecting a device over the network ---------------------------------
$('connect').onclick = async () => {
  say('connectStatus', '…');
  const data = await post('/api/connect', {address: $('address').value});
  // adb's own sentence either way: it is the only place the outcome is stated.
  say('connectStatus', data.output, !data.ok);
  if (data.ok) {
    await loadDevices();
    $('device').value = data.address;
    markSelected(); onDeviceChange();
  }
};
$('address').addEventListener('keydown', e => { if (e.key === 'Enter') $('connect').click(); });
function remoteRecipe() {
  // The host from whatever was typed, so the lines can be used as they stand.
  const typed = ($('address').value || '').trim().split(':')[0];
  const host = typed || '<host>';
  const port = location.port || '8722';
  const key = '-i ~/.ssh/id_ed25519 ';
  const step = (label, command, note) =>
    `<div style="margin-bottom:12px">
       <div style="font-size:11px;color:var(--dim);margin-bottom:5px">${label}</div>
       <div class="cmd">${esc(command)}</div>
       <div style="font-size:11px;color:var(--faint);margin-top:5px">${note}</div>
     </div>`;
  $('remoteCmds').innerHTML =
    step(t('remote.a'),
         `ssh ${key}-L ${port}:127.0.0.1:${port} user@${host}\n` +
         `  # on that host:  python3 ui/server.py`,
         t('remote.aNote')) +
    step(t('remote.b'), `ssh ${key}-N -L 5555:127.0.0.1:5555 user@${host}`,
         t('remote.bNote')) +
    step(t('remote.c'),
         `ssh ${key}-N -L 5038:127.0.0.1:5037 user@${host}\n` +
         `ANDROID_ADB_SERVER_PORT=5038 python3 ui/server.py`,
         t('remote.cNote')) +
    `<div class="mono" style="font-size:11px;color:var(--faint)">` +
    `${t('remote.server')}: ${esc(adbServer)}</div>`;
}
$('toggleRemote').onclick = () => {
  const shown = !$('remoteBox').classList.toggle('hidden');
  $('toggleRemote').textContent = t(shown ? 'act.remoteHide' : 'act.remoteShow');
  if (shown) remoteRecipe();
};
$('address').addEventListener('input', () => {
  if (!$('remoteBox').classList.contains('hidden')) remoteRecipe();
});
$('togglePair').onclick = () => {
  const shown = !$('pairBox').classList.toggle('hidden');
  $('togglePair').textContent = t(shown ? 'act.pairHide' : 'act.pairShow');
};
$('pair').onclick = async () => {
  say('connectStatus', '…');
  const data = await post('/api/pair', {address: $('pairAddress').value,
                                        code: $('pairCode').value});
  say('connectStatus', data.ok ? `${data.output} — ${t('st.paired')}` : data.output,
      !data.ok);
  if (data.ok && !$('address').value) {
    // The debugging port is a different one, so only the host carries over.
    $('address').value = $('pairAddress').value.split(':')[0];
  }
};

$('provision').onclick = async () => {
  const data = await post('/api/setup', {device: dev()});
  say('launchStatus', data.message, !data.ok);
  if (data.ok) showWorkspace();
};

// ---- where the run lands ---------------------------------------------------
// A run needs an output directory, and making someone invent a path before
// anything can happen is friction that buys nothing. Named after the target and
// the minute, so two runs never land on top of each other.
function suggestedOutput() {
  const name = ($('package').value || 'run').split('.').filter(Boolean).pop();
  const stamp = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '');
  return `./run-${name}-${stamp}`;
}
// Filled only while nobody else has claimed the field. Guessing from the name
// would silently redirect someone who opened a past run from the launch screen.
let outputIsAuto = true;
function fillOutputIfUntouched() {
  if (outputIsAuto) $('output').value = suggestedOutput();
}

// ---- view switching -------------------------------------------------------
function showWorkspace() {
  $('launchView').classList.add('hidden');
  $('workView').classList.remove('hidden');
  fillOutputIfUntouched();
  refreshScreen(); loadFindings();
}
function onDeviceChange() { markSelected(); loadPackages(); refreshScreen(); loadDeviceInfo(); }

$('openWorkspace').onclick = () => dev() ? showWorkspace()
  : say('launchStatus', t('dev.pickFirst'), true);
$('backToLaunch').onclick = () => {
  $('workView').classList.add('hidden');
  $('launchView').classList.remove('hidden');
  loadDevices(); loadRuns();
};
$('rescan').onclick = loadDevices;
$('device').onchange = onDeviceChange;
$('package').onchange = fillOutputIfUntouched;
$('output').oninput = () => { outputIsAuto = false; };
$('reloadPkgs').onclick = loadPackages;
$('refreshScreen').onclick = refreshScreen;
$('runsRoot').onchange = loadRuns;
$('toggleTargets').onclick = () => {
  targetsOn = !targetsOn;
  $('toggleTargets').textContent = t(targetsOn ? 'act.hideTargets' : 'act.showTargets');
  if (targetsOn) loadTargets(); else $('overlay').innerHTML = '';
};
$('expandLog').onclick = () => {
  const tall = $('log').classList.toggle('tall');
  $('expandLog').textContent = t(tall ? 'act.collapse' : 'act.expand');
};
document.querySelectorAll('[data-lang-switch]').forEach(node => node.onclick = () => {
  LANG = LANG === 'en' ? 'ru' : 'en';
  applyLang();
});
$('back').onclick = () => post('/api/key', {device: dev(), key: 'KEYCODE_BACK'})
  .then(() => setTimeout(refreshScreen, 600));
$('home').onclick = () => post('/api/key', {device: dev(), key: 'KEYCODE_HOME'})
  .then(() => setTimeout(refreshScreen, 600));
$('bindPill').textContent = '🔒 ' + location.host;

applyLang();          // draws every label, and the first loadDevices/loadRuns with it
pollLog();
</script>
</body>
</html>
